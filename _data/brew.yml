# The brew method — powers the homepage teaser, /how-to-make-masala-chai/,
# and the HowTo JSON-LD (which is rich-result eligible in Google).

serves: 2

# The amounts, per cup of chai. The brew guide on /how-to-make-masala-chai/
# multiplies these by however many cups someone is making. In the text below,
# {water}, {milk} and {mix} stand for the amount for `serves` cups (`text`),
# and the calculator swaps in the scaled amount.
amounts:
  water: { per_cup: 0.5, unit: "cup", text: "1 cup" }
  milk:  { per_cup: 0.5, unit: "cup", text: "1 cup" }
  mix:   { per_cup: 1, unit: "heaped tbsp", text: "2 heaped tbsp" }
mix_grams_per_cup: 5         # 1 heaped tbsp; a 125 g pouch makes 25 cups
pouch_grams: 125
max_cups: 30
# From this many cups, the kit says to use a bigger pot (it rises).
big_pot_from: 5
big_pot: "A large heavy-bottomed pot, no more than half full (it rises)"
total_time: "PT10M"          # ISO 8601 duration for schema.org
prep_time: "PT2M"
cook_time: "PT8M"

supplies:
  - "{water} water"
  - "{milk} whole milk"
  - "{mix} God's Chai masala blend"
  - "Sugar to taste"

tools:
  - "Small heavy-bottomed pot"
  - "Fine mesh strainer"

steps:
  - label: "Boil"
    clip: "brew-boil"
    title: "{water} water, {milk} milk"
    desc: "Bring both to a boil together in a small pot. Equal parts, no measuring cup gymnastics."
    accent: false
  - label: "Blend"
    clip: "brew-blend"
    title: "{mix} God's Chai"
    desc: "Stir in the mix and sugar to taste. Give the bag a shake first — the spices settle."
    accent: false
  - label: "Rise"
    clip: "brew-rise"
    title: "Let it rise 2–3 times"
    desc: "Let it climb the pot, pull it back, repeat. This is where the magic happens — don't skip it."
    accent: true
  - label: "Strain"
    clip: "brew-strain"
    title: "Strain and enjoy"
    desc: "Pour through a fine strainer into your cup. Strong, spiced, exactly right."
    accent: false

# The shades in the brew guide (/how-to-make-masala-chai/), lightest first,
# shown as one slim colour bar; the one picked sets the simmer time, the number
# of rises and the timer. hex is the colour of the chai:
# the warm caramel of chai seen through a glass, checked against our own
# brewing footage (the page adds the sheen and depth that make it look wet).
# minutes is how long to simmer once the mix is in, for 2 cups on
# medium-high; rises is how
# many times to let it climb the pot in that time. house: true marks how we
# pour it at the cart. Change any of it here and the guide and timer follow.
shades:
  - name: "Light"
    hex: "#D9B98E"
    minutes: 1
    rises: 1
    note: "Milky and gentle. The spice is there, the tea stays soft."
  - name: "Smooth"
    hex: "#C79A68"
    minutes: 2
    rises: 2
    note: "Golden and easy-going. A good first cup for anyone new to chai."
  - name: "Bold"
    hex: "#A9703F"
    minutes: 3
    rises: 3
    house: true
    note: "Deep caramel, strong and spiced: how we pour it at the cart."
  - name: "Extra bold"
    hex: "#7E4B27"
    minutes: 4.5
    rises: 4
    note: "Dark and bold, for chai people. Much longer and it turns bitter."
# Where the timer's colour starts: milk with the mix just stirred in.
shade_start: "#ECDDC4"
# Rough timings that grow with the pot (a stove on medium-high):
# bringing the water and milk to the boil takes boil_base + boil_per_cup x cups
# minutes, and a bigger pot takes a little longer to come back up each time it
# rises, so the simmer gets simmer_per_cup extra minutes for each cup over 2.
boil_base: 2.5
boil_per_cup: 0.75
simmer_per_cup: 0.15
