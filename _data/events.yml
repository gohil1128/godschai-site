# God's Chai pop-up schedule — single source of truth.
# Powers the /events/ page, the homepage teaser, and the Event JSON-LD.
#
# start / end are ISO dates (YYYY-MM-DD) and are what the structured data uses.
# `mon` and `day` are the display strings on the date chip (e.g. Sep / 4–5).
# Past events are hidden from visitors by assets/js/site.js but stay in the
# HTML so search engines and AI crawlers can still read the full history.
# See SEO.md for how to add an event.

