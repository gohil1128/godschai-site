# The premix shop. Everything about selling lives here; SEO.md ("The shop")
# walks through it in plain English.
#
# Payment happens on Square's own checkout page, never on this site: the
# buttons on /premixes/ just send people to one of the Square checkout links
# below. Card numbers and addresses go straight to Square.

# The switch. false: the site shows "launching this fall" and the email
# signups, exactly as before. true: every premix box turns into "order now".
open: true

# Per pouch, in dollars. This is what the site shows; what people are actually
# charged is set in Square, so change both together.
price: 14.99

# Most pouches of one blend in a single order. Each extra step means more
# checkout links below, so raise it with care.
max_each: 3

# Contact for orders and refunds. Shown on the shipping, refund, privacy and
# thank-you pages, and set as the support email on every Square checkout.
# Leave it blank and those pages point people at Instagram instead.
email: "sip@godschai.com"

# Where it can go. No pickups: every order is delivered or shipped.
# fee is in dollars and must match the shipping fee on that zone's Square links.
# tax: the sales tax on that zone's orders, as a fraction (0.06 = 6%), and
# tax_name what it's called. It must match the tax on that zone's Square links:
# the Saskatoon links carry Square's 6% PST; the rest-of-Canada links don't.
# free_from: orders with at least this many pouches ship free, so their Square
# links carry no shipping fee.
zones:
  saskatoon:
    label: "Saskatoon"
    fee: 0
    tax: 0.06
    tax_name: "PST"
    short: "Free delivery"
    how: "We drop it at your door, free, anywhere in Saskatoon."
    when: "Usually within 3 days of your order."
  canada:
    label: "Anywhere else in Canada"
    fee: 9.99
    free_from: 5
    short: "Canada Post, tracked"
    how: "We ship it by Canada Post Expedited Parcel, with tracking."
    when: "Packed within 2 business days, then usually 2–7 business days in the post."

# The small "Add to your order" box in the cart. It lists every product in
# _data/premixes.yml that isn't in the cart yet, so a new product appears in
# it on its own once it's added there (it also needs its Square links).
upsell_title: "Add to your order"

# Refunds. days: how long after delivery someone has to ask.
refund_days: 30

# One Square checkout link per order: o<Original pouches>r<Rose pouches>-<zone>.
# So o2r1-canada is two Original Masala and one Rose & Cardamom, shipped.
# The -canada links for 5 or more pouches (o2r3, o3r2, o3r3) carry no
# shipping fee: see free_from above. Every link asks for a shipping address
# and sends people back to /order-confirmed/ once they've paid. A blank one
# just shows "message us" for that order, so the shop never sends anyone to a
# dead link.
links:
