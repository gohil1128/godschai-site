# The five spices in the masala, for /masala-chai-spices/.
# amount: rough quantity for two cups.  role: the two-word job it does.
- name: "Green cardamom"
  amount: "4–5 pods"
  role: "The backbone"
  desc: "Cracked, not ground. The flavour people mean when they say a cup tastes like chai."
- name: "Fresh ginger"
  amount: "A thumb, sliced"
  role: "The heat"
  desc: "A clean heat at the back of the throat. Skip it and the cup goes flat."
- name: "Cassia bark"
  amount: "One short stick"
  role: "The sweetness"
  desc: "Usually sold as cinnamon. A little rounds the pot off; too much tastes like a candle."
- name: "Cloves"
  amount: "2, no more"
  role: "The depth"
  desc: "A dark, deep base note. Two at most: four take over."
- name: "Black pepper"
  amount: "4–5, cracked"
  role: "The finish"
  desc: "Not heat but length. It is why a good cup keeps going after you swallow."
