# The five spices in the masala, for /masala-chai-spices/.
# amount: rough quantity for two cups.  role: the two-word job it does.
- name: "Green cardamom"
  amount: "4–5 pods"
  role: "The backbone"
  desc: "Cracked open, not ground. This is the flavour most people actually mean when they say a cup tastes like chai — sweet, floral, a little camphorous. If you only buy one spice whole, buy this one."
- name: "Fresh ginger"
  amount: "A thumb, sliced"
  role: "The heat"
  desc: "Goes in early so it has time to mellow. Fresh gives a clean warmth at the back of the throat; dried is sharper and needs less. Skip it and the cup tastes flat no matter what else you add."
- name: "Cassia bark"
  amount: "One short stick"
  role: "The sweetness"
  desc: "Usually sold as cinnamon. Cheap, loud, and the spice most powdered blends hide behind. A little rounds the pot off; too much and everything tastes like a scented candle."
- name: "Cloves"
  amount: "2, no more"
  role: "The depth"
  desc: "The most dangerous one in the pot. Two cloves add a dark, almost medicinal base note. Four will take over completely and there is no rescuing it."
- name: "Black pepper"
  amount: "4–5, cracked"
  role: "The finish"
  desc: "The one people leave out and shouldn't. It doesn't read as heat, it reads as length — the reason a proper cup keeps going after you swallow."
