<style>
  /* ================= Daylight palette =================
     Every colour on the site is one of these. The page is the daylight set;
     anything marked .gc-dark (the photo sections, and the header while it
     floats over the hero photo) puts the original dark set back for its
     children, so text over a photo stays readable. To retune the site, change
     the values here. Gold and coral stay as they are for buttons; the -t
     versions are the same hues, darkened, for text and thin lines on cream. */
  :root{
    color-scheme:light;
    --gc-bg:#F2EBE1;--gc-bg-rgb:242,235,225;--gc-bg2:#EAE0D2;--gc-card:#FBF8F3;--gc-surf-rgb:251,248,243;
    --gc-fg:#3C2116;--gc-fg2:#4A3223;--gc-fg3:#5C4434;--gc-fg4:#6E5646;--gc-muted:#765749;--gc-ink-rgb:60,33,22;
    --gc-gold-t:#8B472C;--gc-gold-h:#763B24;--gc-gold-d:#7E4128;--gc-gold-rgb:181,95,62;
    --gc-coral-t:#8B472C;--gc-coral-rgb:181,95,62;--gc-shadow-rgb:59,31,18;
    --gc-logo:#3C2116;
  }
  .gc-dark{
    color-scheme:dark;
    --gc-bg:#100A05;--gc-bg-rgb:16,10,5;--gc-bg2:#1A100A;--gc-card:#2E1D13;--gc-surf-rgb:28,17,10;
    --gc-fg:#F2EBE1;--gc-fg2:#E7D6C4;--gc-fg3:#D6C7B4;--gc-fg4:#C7B29E;--gc-muted:#AB9280;--gc-ink-rgb:242,235,225;
    --gc-gold-t:#B55F3E;--gc-gold-h:#E39874;--gc-gold-d:#A4573A;--gc-gold-rgb:215,131,95;
    --gc-coral-t:#E39874;--gc-coral-rgb:227,152,116;--gc-shadow-rgb:0,0,0;
    --gc-logo:#F2EBE1;
    color:var(--gc-fg);
  }
  /* The header's logo: the cream lockup on dark, the brown one on daylight. */
  gods-chai-logo .gc-logo-d{display:none!important}
  .gc-dark gods-chai-logo .gc-logo-d{display:block!important}
  .gc-dark gods-chai-logo .gc-logo-l{display:none!important}
</style>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  html{overflow-x:clip;scroll-behavior:smooth}
  body{overflow-x:clip;background:var(--gc-bg)}
  ::selection{background:#B55F3E;color:#FFFFFF}
  a{color:var(--gc-gold-t)}
  a:hover{color:var(--gc-gold-h)}
  @keyframes gc-marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  @keyframes gc-kb{from{transform:scale(1.03)}to{transform:scale(1.13)}}
  @keyframes gc-cuedot{0%{transform:translateY(0);opacity:0.2}50%{transform:translateY(8px);opacity:1}100%{transform:translateY(0);opacity:0.2}}
  /* Skip link — visible only when focused. */
  .gc-skip{position:absolute;left:-9999px;top:0;z-index:200;background:#B55F3E;color:#FFFFFF;font-family:'Hanken Grotesk',sans-serif;font-weight:700;font-size:14px;padding:12px 18px;border-radius:0 0 10px 0;text-decoration:none}
  .gc-skip:focus{left:0}
  :focus-visible{outline:2px solid var(--gc-gold-t);outline-offset:3px}
  /* Animated logo in the header. Until the script registers the element the
     static logo inside it is what shows, and it keeps showing if the script
     never arrives; once :defined matches, the component's own layers take over. */
  gods-chai-logo:defined > picture{display:none!important}  /* beats the include's inline display:block */
  /* The component tints all eleven strokes with one colour, but the lockup wears
     the pouch's colours: "God's" in rust, the brush stroke under it in gold, and
     "CHAI" and the tagline in the cream set by the tint attribute.
     tools/optimize-logo-sting.py stamps data-layer on each stroke so these can be
     picked out by name; tools/build-logo.py uses the same colours for the stills.
     Overriding an inline background-color needs !important. */
  gods-chai-logo [data-layer="G"],
  gods-chai-logo [data-layer="od"],
  gods-chai-logo [data-layer="apos"],
  gods-chai-logo [data-layer="s"]{background-color:#B6502B!important}
  gods-chai-logo [data-layer="swash"]{background-color:#D3A849!important}
  /* The fixed nav is 100px tall with the 76px lockup, so anchored sections need
     to clear more than the 84px they carry inline. */
  section[id]{scroll-margin-top:108px!important}

  /* Phones: the nav's four links + @godschai pill overflow past the viewport edge
     (and get silently clipped by overflow-x:clip), so tighten it up down there. */
  @media (max-width:560px){
    header nav{gap:8px!important;padding-left:13px!important;padding-right:13px!important}
    header nav gods-chai-logo,header nav img{height:56px!important;width:56px!important}
    header nav > div{gap:10px!important;font-size:13px!important}
    header nav .gc-navend > a{font-size:12px!important;padding:10px 11px!important}
    header nav .gc-nav-long{display:none}
    section[id]{scroll-margin-top:88px!important}
  }
  @media (max-width:400px){
    header nav{gap:5px!important;padding-left:10px!important;padding-right:10px!important}
    header nav gods-chai-logo,header nav img{height:46px!important;width:46px!important}
    header nav > div{gap:6px!important;font-size:11.5px!important}
    header nav .gc-navend > a{font-size:11px!important;padding:9px 9px!important}
    section[id]{scroll-margin-top:78px!important}
  }
  @media (max-width:355px){
    header nav{flex-wrap:wrap!important;justify-content:center!important;row-gap:6px!important}
    /* the wrapped nav is taller again, so the anchor offset has to clear that */
    section[id]{scroll-margin-top:124px!important}
  }

  /* Footer links: one short line of the main pages, one of the guides. */
  .gc-fl{display:flex;flex-wrap:wrap;gap:2px 18px;margin:18px 0 0;font-size:15px}
  .gc-fl a{text-decoration:none;color:var(--gc-fg)}
  .gc-fl-guides{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 14px;margin:8px 0 0;font-size:13.5px}
  .gc-fl-guides span{font-family:'DM Mono',monospace;font-size:10.5px;letter-spacing:0.14em;text-transform:uppercase;color:var(--gc-muted)}
  .gc-fl-guides a{text-decoration:none;color:var(--gc-muted)}
  .gc-fl a:hover,.gc-fl-guides a:hover{color:var(--gc-coral-t)}

  /* Phone menu: below 760px the nav links and the @godschai pill fold into one
     button that opens this panel (site.js, "phone menu"). */
  .gc-menubtn{display:none;align-items:center;justify-content:center;width:42px;height:42px;padding:0;border-radius:999px;cursor:pointer;
    background:transparent;color:var(--gc-fg);border:1px solid rgba(var(--gc-ink-rgb),0.22)}
  .gc-menubtn path{transition:transform .25s ease;transform-origin:12px 12px}
  .gc-menubtn[aria-expanded="true"] .gc-mb-a{transform:translateY(3px) rotate(45deg)}
  .gc-menubtn[aria-expanded="true"] .gc-mb-b{transform:translateY(-3px) rotate(-45deg)}
  .gc-nmenu{position:absolute;top:calc(100% + 6px);left:12px;right:12px;padding:10px 22px 20px;border-radius:24px;
    background:var(--gc-bg);color:var(--gc-fg);border:1px solid rgba(var(--gc-ink-rgb),0.12);
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 24px 60px rgba(0,0,0,0.25)}
  .gc-nmenu[hidden]{display:none}
  .gc-nmenu > a{display:block;padding:11px 0;text-decoration:none;color:var(--gc-fg);font:400 1.6rem/1.15 'Instrument Serif',serif;
    border-bottom:1px solid rgba(var(--gc-ink-rgb),0.08)}
  .gc-nmenu-soc{display:flex;gap:10px;margin-top:16px}
  @media (max-width:760px){
    header nav .gc-navlinks,header nav .gc-nav-ig{display:none!important}
    .gc-menubtn{display:flex}
  }
  @media (min-width:761px){.gc-nmenu{display:none!important}}
  @media (prefers-reduced-motion:reduce){.gc-menubtn path{transition:none}}

  /* Tap targets: the nav and footer links are only 14-18px tall on their own.
     Vertical padding grows the hit area without moving anything visually. */
  header nav > div > a{padding:13px 0!important;white-space:nowrap}
  footer .gc-footer-links a{padding:6px 0!important;margin:-3px 0!important;display:inline-block}
  /* The hot-chai card's panels carry min-width:260/300px, which is wider than a
     320px screen's content box — it forced the card to overflow. */
  @media (max-width:430px){
    #hot > div > div{min-width:0!important}
  }
  /* Long-form article copy (brew guide, catering). Matches the site voice/palette. */
  .gc-prose{color:var(--gc-fg3);font-size:1.05rem;line-height:1.65}
  .gc-prose p{margin:0 0 18px}
  .gc-prose h2{font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(1.6rem,3.4vw,2.3rem);letter-spacing:0;color:var(--gc-fg);margin:38px 0 12px}
  .gc-prose h3{font-family:'Instrument Serif',serif;font-weight:400;font-size:1.28rem;color:var(--gc-fg);margin:26px 0 8px}
  .gc-prose ul,.gc-prose ol{margin:0 0 18px;padding-left:22px}
  .gc-prose li{margin:0 0 9px}
  .gc-prose strong{color:var(--gc-fg);font-weight:600}

  /* ================= Interactive states =================
     Every hover on this site used to be a style-hover="..." attribute — a
     leftover from the React runtime that was removed, which nothing has read
     since. So nothing on the page answered a cursor, while the transition:
     declarations sat beside them animating properties that never changed.
     These are those same values as real CSS.

     :focus-visible gets the identical treatment so a keyboard sees what a mouse
     sees, and :active gives a press, which is the only feedback a touchscreen
     ever gets — there is no hover on a phone.

     !important throughout: the thing being overridden is an inline style
     attribute, which otherwise wins. */
  .gc-pill,.gc-pill-coral,.gc-pill-ghost,.gc-ico,.gc-iconbtn,.gc-pill-dark,.gc-pill-cream{
    transition:background-color .26s ease,border-color .26s ease,color .26s ease,
               box-shadow .26s ease,transform .16s cubic-bezier(.2,.7,.2,1)}
  /* Chai on the boil: every filled button carries a few seconds of our
     boiling-chai footage (the hero's pot, cropped to the bubbling surface and
     made into a small looping image, uploads/opt/btn-boil.webp, 80 KB) under a
     see-through chai tint, so it reads as a gentle animation rather than a
     video. Hover deepens the tint. With reduced motion on it's a still frame. */
  :root{--gc-boil:url("{{ '/uploads/opt/btn-boil.webp' | relative_url }}")}
  @media (prefers-reduced-motion:reduce){:root{--gc-boil:url("{{ '/uploads/opt/btn-boil-still.webp' | relative_url }}")}}
  .gc-pill,.gc-pill-coral,.gc-club button[type="submit"]{
    background:radial-gradient(130% 95% at 28% -18%,rgba(255,226,206,0.26) 0%,rgba(255,226,206,0) 56%),
      linear-gradient(160deg,rgba(222,132,96,0.80) 0%,rgba(181,95,62,0.78) 50%,rgba(150,74,44,0.86) 100%),
      var(--gc-boil) center/cover no-repeat,#B55F3E!important;
    color:#FFF8EE!important;text-shadow:0 1px 2px rgba(70,28,10,0.35);
    box-shadow:inset 0 1px 0 rgba(255,226,206,0.35),0 6px 16px -9px rgba(110,45,20,0.6)}
  .gc-pill:hover,.gc-pill:focus-visible,.gc-pill-coral:hover,.gc-pill-coral:focus-visible,.gc-club button[type="submit"]:hover{
    background:radial-gradient(130% 95% at 28% -18%,rgba(255,226,206,0.20) 0%,rgba(255,226,206,0) 56%),
      linear-gradient(160deg,rgba(200,112,78,0.86) 0%,rgba(156,79,49,0.84) 50%,rgba(128,62,36,0.90) 100%),
      var(--gc-boil) center/cover no-repeat,#9C4F31!important}
  .gc-pill-ghost:hover,.gc-pill-ghost:focus-visible{border-color:var(--gc-gold-t)!important;background:rgba(var(--gc-gold-rgb),0.12)!important}
  .gc-ico:hover,.gc-ico:focus-visible{border-color:var(--gc-gold-t)!important;color:var(--gc-gold-t)!important}
  .gc-iconbtn:hover,.gc-iconbtn:focus-visible{background:rgba(var(--gc-bg-rgb),0.8)!important}
  .gc-pill:active,.gc-pill-coral:active,.gc-pill-ghost:active,
  .gc-ico:active,.gc-iconbtn:active{transform:scale(0.955)}

  /* Cards. --gc-bh lets a card name its own hover edge (the coral brew step)
     without needing a class of its own. */
  .gc-card{transition:border-color .32s ease}
  .gc-card:hover,.gc-card:focus-within{border-color:var(--gc-bh,rgba(var(--gc-gold-rgb),0.45))!important}
  .gc-lift{transition:transform .35s cubic-bezier(.2,.7,.2,1),border-color .35s ease,box-shadow .35s ease}
  .gc-lift:hover,.gc-lift:focus-within{transform:translateY(-4px)}
  .gc-zoom{transition:transform .45s cubic-bezier(.2,.7,.2,1)}
  .gc-zoom:hover,.gc-zoom:focus-within{transform:scale(1.02)}

  /* Prose and nav links. The nav had no feedback at all; this draws a rule
     under the link from the left rather than switching a colour on. */
  a{transition:color .22s ease}
  header nav > div > a{position:relative}
  header nav > div > a::after{content:"";position:absolute;left:0;right:0;bottom:9px;height:1.5px;
    background:#B55F3E;transform:scaleX(0);transform-origin:left center;
    transition:transform .34s cubic-bezier(.2,.7,.2,1)}
  header nav > div > a:hover::after,header nav > div > a:focus-visible::after{transform:scaleX(1)}

  /* Email fields. Their only feedback was the focus ring the browser draws
     around them; the field itself never acknowledged the cursor. */
  /* The email sign-up field (_includes/signup-form.html): a hairline underline, no box. */
  .gc-su-in{box-sizing:border-box;margin:0;padding:8px 0 9px;min-height:40px;border:0;border-bottom:1px solid rgba(var(--gc-ink-rgb),0.24);border-radius:0;
    background:transparent;color:var(--gc-fg);font:400 16px 'Hanken Grotesk',sans-serif;-webkit-appearance:none;appearance:none}
  .gc-su-in::placeholder{color:var(--gc-muted);opacity:0.7}
  input[type="email"]{transition:border-color .22s ease,background-color .22s ease}
  input[type="email"]:hover{border-color:rgba(var(--gc-ink-rgb),0.34)!important}
  input[type="email"]:focus{border-color:rgba(var(--gc-gold-rgb),0.55)!important;background:rgba(var(--gc-ink-rgb),0.09)!important}
  /* Both email fields carry outline:none inline, which also deleted the focus
     ring for anyone moving through the form on a keyboard. Put it back. */
  input[type="email"]:focus-visible{outline:2px solid var(--gc-gold-t)!important;outline-offset:2px}
  /* ...except the minimal underline fields, which show focus as a coral underline. */
  input.gc-su-in[type="email"]:hover,.gc-eq label input[type="email"]:hover,.gc-bk-f input[type="email"]:hover,.gc-co-f input[type="email"]:hover{border-color:rgba(var(--gc-ink-rgb),0.4)!important}
  input.gc-su-in[type="email"]:focus,.gc-eq label input[type="email"]:focus,.gc-bk-f input[type="email"]:focus,.gc-co-f input[type="email"]:focus{
    background:transparent!important;border-color:var(--gc-coral-t)!important;box-shadow:0 1px 0 var(--gc-coral-t);outline:none}
  input.gc-su-in[type="email"]:focus-visible,.gc-eq label input[type="email"]:focus-visible,.gc-bk-f input[type="email"]:focus-visible,.gc-co-f input[type="email"]:focus-visible{outline:none!important}

  /* The ticker runs on a loop; stop it while someone is reading it. */
  /* !important: the track sets animation as an inline shorthand, which carries
     an inline animation-play-state:running with it. */
  [data-gc-marquee]:hover [data-gc-marquee-track],
  [data-gc-marquee]:focus-within [data-gc-marquee-track]{animation-play-state:paused!important}

  /* A chosen card lights up (the delivery choice in the cart and on /checkout/). */
  .gc-card.is-on{border-color:var(--gc-bh,rgba(var(--gc-gold-rgb),0.5))!important;
    box-shadow:0 0 0 1px var(--gc-bh,rgba(var(--gc-gold-rgb),0.5)),0 18px 40px -24px var(--gc-bh,rgba(var(--gc-gold-rgb),0.5))}
  /* The welcome code, shown after a signup and in the cart: tap to copy. */
  .gc-code{display:inline-block;margin:3px 2px;padding:3px 10px;border:1.5px dashed var(--gc-gold-t);border-radius:8px;
    background:rgba(var(--gc-gold-rgb),0.1);color:var(--gc-fg);font:500 14px 'DM Mono',monospace;letter-spacing:0.08em;cursor:pointer;
    vertical-align:baseline;transition:background-color .2s ease}
  .gc-code:hover,.gc-code:focus-visible{background:rgba(var(--gc-gold-rgb),0.22)}
  /* The signup box's light: idle, sending, done. */
  .gc-status{display:block;width:124px;height:124px;margin:-16px auto 6px}
  .gc-status[hidden]{display:none}

  /* Hovering is a deliberate act, so it stays. Everything that moves on its
     own, or moves the page under someone, comes off. */
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    /* The ticker looped forever with nothing to stop it. */
    [data-gc-marquee-track]{animation:none!important}
    input[type="email"]{transition:none}
    .gc-pill,.gc-pill-coral,.gc-pill-ghost,.gc-ico,.gc-iconbtn,.gc-pill-dark,.gc-pill-cream,
    .gc-card,.gc-lift,.gc-zoom,a,header nav > div > a::after{transition:none}
    .gc-lift:hover,.gc-lift:focus-within,.gc-zoom:hover,.gc-zoom:focus-within{transform:none}
    .gc-pill:active,.gc-pill-coral:active,.gc-pill-ghost:active,
    .gc-ico:active,.gc-iconbtn:active{transform:none}
    header nav > div > a::after{transform:scaleX(0)}
    header nav > div > a:hover::after,header nav > div > a:focus-visible::after{transform:scaleX(1)}
  }
  /* Visually hidden, still read by screen readers and search engines */
  .gc-vh{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  /* A wide photo across a page (_includes/photo-band.html) */
  .gc-band{max-width:1240px;margin:0 auto;padding:clamp(6px,1.4vw,14px) clamp(18px,4vw,40px) clamp(20px,3vw,34px)}
  .gc-band-pic{aspect-ratio:var(--band-ratio,21/9);border-radius:clamp(18px,2.4vw,28px);overflow:hidden;background:var(--gc-card);box-shadow:0 22px 50px -34px rgba(var(--gc-shadow-rgb),0.7)}
  .gc-band figcaption{margin:12px 2px 0;font:400 11.5px/1.5 'DM Mono',monospace;letter-spacing:0.08em;text-transform:uppercase;color:var(--gc-fg4)}
  @media (max-width:700px){.gc-band-pic{aspect-ratio:4/3}}

  /* ---------- Tabs ----------
     One row of tabs instead of a stack of cards: what we cater, how bulk
     orders work, the iced-chai steps, latte vs masala, the five spices.
     The tabs are plain #links, so with JavaScript off every panel shows and a
     tab jumps to it; site.js turns them into real tabs. A soft pill of warm
     light slides to the chosen tab. */
  :root{--gc-glow-rgb:255,196,128;--gc-ray-rgb:240,168,98}
  .gc-tabbar{position:relative;display:flex;gap:2px;width:max-content;max-width:100%;overflow-x:auto;scrollbar-width:none;
    padding:4px;border-radius:999px;background:rgba(var(--gc-ink-rgb),0.05);border:1px solid rgba(var(--gc-gold-rgb),0.16);
    -webkit-overflow-scrolling:touch}
  .gc-tabbar::-webkit-scrollbar{display:none}
  .gc-tab{position:relative;z-index:1;flex:none;display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:999px;
    font:600 14px/1 'Hanken Grotesk',system-ui,sans-serif;color:var(--gc-fg4);text-decoration:none;white-space:nowrap;
    transition:color .3s ease;-webkit-tap-highlight-color:transparent}
  .gc-tab small{font:500 10.5px/1 'DM Mono',monospace;letter-spacing:0.08em;color:var(--gc-gold-d);opacity:.8}
  .gc-tab:hover{color:var(--gc-fg)}
  .gc-tab[aria-selected="true"]{color:var(--gc-fg)}
  .gc-tab:focus-visible{outline:2px solid var(--gc-gold-t);outline-offset:1px}
  .gc-tabbar:not(.has-glow) .gc-tab[aria-selected="true"]{background:var(--gc-card);box-shadow:0 0 0 1px rgba(var(--gc-gold-rgb),0.26)}
  .gc-tabglow{position:absolute;z-index:0;top:4px;bottom:4px;left:0;width:0;border-radius:999px;pointer-events:none;
    background:linear-gradient(180deg,rgba(255,252,246,0.95),var(--gc-card));
    box-shadow:0 0 0 1px rgba(var(--gc-gold-rgb),0.26),0 6px 18px -8px rgba(var(--gc-glow-rgb),0.9),0 0 26px -6px rgba(var(--gc-glow-rgb),0.55);
    transition:transform .5s cubic-bezier(.2,.7,.2,1),width .5s cubic-bezier(.2,.7,.2,1)}
  .gc-dark .gc-tabglow,[data-gc-theme="dark"] .gc-tabglow{background:linear-gradient(180deg,rgba(255,236,214,0.16),rgba(255,236,214,0.06))}
  .gc-tabpanel{position:relative;max-width:64ch;padding:22px 2px 6px;scroll-margin-top:calc(var(--gc-navh,72px) + var(--gc-stickh,0px) + 16px)}
  .gc-tabpanel::before{content:"";position:absolute;z-index:-1;left:-40px;top:-20px;width:min(520px,90vw);height:260px;pointer-events:none;
    background:radial-gradient(closest-side,rgba(var(--gc-glow-rgb),0.20),rgba(var(--gc-glow-rgb),0) 100%);filter:blur(6px)}
  .gc-tp-k{display:flex;justify-content:space-between;gap:14px;font:500 11px/1.4 'DM Mono',monospace;letter-spacing:0.18em;text-transform:uppercase;color:var(--gc-gold-d)}
  .gc-tabpanel h2,.gc-tabpanel h3{font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(1.45rem,2.6vw,1.8rem);line-height:1.1;margin:10px 0 0;color:var(--gc-fg)}
  .gc-tabpanel p{color:var(--gc-fg4);line-height:1.62;margin:10px 0 0;font-size:1.02rem}
  .gc-tabpanel .gc-tp-num{font-family:'Instrument Serif',serif;font-size:52px;line-height:0.8;color:var(--gc-gold-t);opacity:.9}
  .gc-tabpanel.is-in{animation:gcTabIn .55s cubic-bezier(.2,.7,.2,1)}
  @keyframes gcTabIn{from{opacity:0;transform:translateY(8px);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}
  .gc-tabpanels{position:relative;isolation:isolate}
  .gc-tabnext{display:inline-flex;align-items:center;gap:6px;margin-top:16px;font:600 14px/1 'Hanken Grotesk',sans-serif;color:var(--gc-gold-t);text-decoration:none}
  .gc-tabnext:hover{color:var(--gc-gold-h)}
  @media (max-width:560px){
    .gc-tab{padding:8px 12px;font-size:13.5px}
