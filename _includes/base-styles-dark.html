<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  html{overflow-x:clip;scroll-behavior:smooth}
  body{overflow-x:clip;background:#100A05}
  ::selection{background:#F2A93C;color:#100A05}
  a{color:#F2A93C}
  a:hover{color:#FFBA55}
  @keyframes gc-marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  @keyframes gc-kb{from{transform:scale(1.03)}to{transform:scale(1.13)}}
  @keyframes gc-cuedot{0%{transform:translateY(0);opacity:0.2}50%{transform:translateY(8px);opacity:1}100%{transform:translateY(0);opacity:0.2}}
  /* Skip link — visible only when focused. */
  .gc-skip{position:absolute;left:-9999px;top:0;z-index:200;background:#F2A93C;color:#2B1B12;font-family:'Hanken Grotesk',sans-serif;font-weight:700;font-size:14px;padding:12px 18px;border-radius:0 0 10px 0;text-decoration:none}
  .gc-skip:focus{left:0}
  :focus-visible{outline:2px solid #F2A93C;outline-offset:3px}
  /* Animated logo in the header. Until the script registers the element the
     static logo inside it is what shows, and it keeps showing if the script
     never arrives; once :defined matches, the component's own layers take over. */
  gods-chai-logo:defined > picture{display:none!important}  /* beats the include's inline display:block */
  /* The component tints all eleven strokes with one colour, but the lockup is
     two-tone: "God's" and the brush stroke under it in brand orange, "CHAI" and
     the tagline in the cream set by the tint attribute. tools/optimize-logo-sting.py
     stamps data-layer on each stroke so these can be picked out by name.
     Overriding an inline background-color needs !important. */
  gods-chai-logo [data-layer="G"],
  gods-chai-logo [data-layer="od"],
  gods-chai-logo [data-layer="apos"],
  gods-chai-logo [data-layer="s"],
  gods-chai-logo [data-layer="swash"]{background-color:#F2A93C!important}
  /* The fixed nav is 100px tall with the 76px lockup, so anchored sections need
     to clear more than the 84px they carry inline. */
  section[id]{scroll-margin-top:108px!important}

  /* Phones: the nav's four links + @godschai pill overflow past the viewport edge
     (and get silently clipped by overflow-x:clip), so tighten it up down there. */
  @media (max-width:560px){
    header nav{gap:8px!important;padding-left:13px!important;padding-right:13px!important}
    header nav gods-chai-logo,header nav img{height:56px!important;width:56px!important}
    header nav > div{gap:10px!important;font-size:13px!important}
    header nav > a:last-child{font-size:12px!important;padding:10px 11px!important}
    section[id]{scroll-margin-top:88px!important}
  }
  @media (max-width:400px){
    header nav{gap:5px!important;padding-left:10px!important;padding-right:10px!important}
    header nav gods-chai-logo,header nav img{height:46px!important;width:46px!important}
    header nav > div{gap:6px!important;font-size:11.5px!important}
    header nav > a:last-child{font-size:11px!important;padding:9px 9px!important}
    section[id]{scroll-margin-top:78px!important}
  }
  @media (max-width:355px){
    header nav{flex-wrap:wrap!important;justify-content:center!important;row-gap:6px!important}
    /* the wrapped nav is taller again, so the anchor offset has to clear that */
    section[id]{scroll-margin-top:124px!important}
  }
  /* Newsletter tab. Replaces the modal that used to open by itself: it sits at
     the left edge just below the middle, covers almost nothing, and only opens
     the signup if it is actually tapped. Slides in from off-screen so it is
     noticed. Kept deliberately narrow — this page's copy is left-aligned with
     only 18px of padding on a phone, so every pixel of width here is a pixel
     off the front of someone's sentence. */
  #gc-nudge{position:fixed;left:0;top:56%;z-index:9998;transform:translate(-110%,-50%);
    transition:transform .55s cubic-bezier(.2,.7,.2,1)}
  #gc-nudge.is-in{transform:translate(0,-50%)}
  #gc-nudge-open{display:block;background:#F2A93C;color:#2B1B12;border:0;
    border-radius:0 14px 14px 0;padding:16px 9px;cursor:pointer;
    font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.08em;line-height:1;
    box-shadow:0 10px 30px rgba(0,0,0,0.45);transition:background .25s ease}
  #gc-nudge-open:hover{background:#FFBA55}
  /* Bottom-to-top, like a shop-front tab. */
  #gc-nudge-open span{writing-mode:vertical-rl;transform:rotate(180deg);display:block}
  #gc-nudge-close{position:absolute;top:-13px;right:-13px;width:30px;height:30px;
    display:flex;align-items:center;justify-content:center;padding:0;
    background:#2B1B12;color:#F3E8D3;border:1px solid rgba(242,169,60,0.45);
    border-radius:999px;font-size:15px;line-height:1;cursor:pointer;
    font-family:'Hanken Grotesk',sans-serif}
  #gc-nudge-close:hover{background:#3D2A1B}
  /* On a laptop the hero copy starts ~120px in, so the tab clears it at any
     height. A phone only has 18px of padding, so mid-screen the tab cuts into
     the first letters of the intro line — sit it higher, in the empty band
     between the header and the eyebrow. */
  @media (max-width:560px){#gc-nudge{top:34%}}
  @media (prefers-reduced-motion:reduce){#gc-nudge{transition:none}}

  /* Tap targets: the nav and footer links are only 14-18px tall on their own.
     Vertical padding grows the hit area without moving anything visually. */
  header nav > div > a{padding:13px 0!important;white-space:nowrap}
  footer .gc-footer-links a{padding:6px 0!important;margin:-3px 0!important;display:inline-block}
  /* The hot-chai card's panels carry min-width:260/300px, which is wider than a
     320px screen's content box — it forced the card to overflow. */
  @media (max-width:430px){
    #hot > div > div{min-width:0!important}
  }
  /* Community grid: with three tiles, auto-fit left empty cells (a whole dead
     column at desktop widths). Fixed column counts make the tiles tile exactly. */
  @media (min-width:700px){
    #community div[style*="grid-auto-rows"]{grid-template-columns:repeat(4,1fr)!important}
    #community div[style*="grid-auto-rows"] > div:nth-child(2),
    #community div[style*="grid-auto-rows"] > div:nth-child(3){grid-column:span 1!important;grid-row:span 2!important}
  }
  /* Five spice cards: auto-fit gives a clean row of five from 1180px and 3+2 on a
     tablet, but leaves a 4+1 orphan in the band between. Pin it to three there. */
  @media (min-width:900px) and (max-width:1179px){
    #spice-grid{grid-template-columns:repeat(3,1fr)!important}
  }
  /* Long-form article copy (brew guide, catering). Matches the site voice/palette. */
  .gc-prose{color:#D6C7B4;font-size:1.05rem;line-height:1.65}
  .gc-prose p{margin:0 0 18px}
  .gc-prose h2{font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(1.6rem,3.4vw,2.3rem);letter-spacing:0;color:#F3E8D3;margin:38px 0 12px}
  .gc-prose h3{font-family:'Instrument Serif',serif;font-weight:400;font-size:1.28rem;color:#F3E8D3;margin:26px 0 8px}
  .gc-prose ul,.gc-prose ol{margin:0 0 18px;padding-left:22px}
  .gc-prose li{margin:0 0 9px}
  .gc-prose strong{color:#F3E8D3;font-weight:600}

  /* ================= Interactive states =================
     Every hover on this site used to be a style-hover="..." attribute — a
     leftover from the React runtime that was removed, which nothing has read
     since. So nothing on the page answered a cursor, while the transition:
     declarations sat beside them animating properties that never changed.
     These are those same values as real CSS.

     :focus-visible gets the identical treatment so a keyboard sees what a mouse
     sees, and :active gives a press, which is the only feedback a touchscreen
     ever gets — there is no hover on a phone.

     !important throughout: the thing being overridden is an inline style
     attribute, which otherwise wins. */
  .gc-pill,.gc-pill-coral,.gc-pill-ghost,.gc-ico,.gc-iconbtn,.gc-pill-dark,.gc-pill-cream{
    transition:background-color .26s ease,border-color .26s ease,color .26s ease,
               box-shadow .26s ease,transform .16s cubic-bezier(.2,.7,.2,1)}
  .gc-pill:hover,.gc-pill:focus-visible{background:#FFBA55!important}
  .gc-pill-coral:hover,.gc-pill-coral:focus-visible{background:#FF9C8A!important}
  .gc-pill-ghost:hover,.gc-pill-ghost:focus-visible{border-color:#F2A93C!important;background:rgba(242,169,60,0.12)!important}
  .gc-ico:hover,.gc-ico:focus-visible{border-color:#F2A93C!important;color:#F2A93C!important}
  .gc-iconbtn:hover,.gc-iconbtn:focus-visible{background:rgba(18,11,6,0.8)!important}
  .gc-pill:active,.gc-pill-coral:active,.gc-pill-ghost:active,
  .gc-ico:active,.gc-iconbtn:active{transform:scale(0.955)}

  /* Cards. --gc-bh lets a card name its own hover edge (the coral brew step)
     without needing a class of its own. */
  .gc-card{transition:border-color .32s ease}
  .gc-card:hover,.gc-card:focus-within{border-color:var(--gc-bh,rgba(242,169,60,0.45))!important}
  .gc-lift{transition:transform .35s cubic-bezier(.2,.7,.2,1),border-color .35s ease,box-shadow .35s ease}
  .gc-lift:hover,.gc-lift:focus-within{transform:translateY(-4px)}
  .gc-zoom{transition:transform .45s cubic-bezier(.2,.7,.2,1)}
  .gc-zoom:hover,.gc-zoom:focus-within{transform:scale(1.02)}

  /* Prose and nav links. The nav had no feedback at all; this draws a rule
     under the link from the left rather than switching a colour on. */
  a{transition:color .22s ease}
  header nav > div > a{position:relative}
  header nav > div > a::after{content:"";position:absolute;left:0;right:0;bottom:9px;height:1.5px;
    background:#F2A93C;transform:scaleX(0);transform-origin:left center;
    transition:transform .34s cubic-bezier(.2,.7,.2,1)}
  header nav > div > a:hover::after,header nav > div > a:focus-visible::after{transform:scaleX(1)}

  /* The signup box. It used to appear on its own, fully formed, the instant
     the page loaded. Now it only opens when someone taps the tab, so it can
     afford to arrive rather than just be there. The animation restarts by
     itself every time the overlay goes from display:none to display:flex. */
  @keyframes gc-fade{from{opacity:0}to{opacity:1}}
  @keyframes gc-pop{from{opacity:0;transform:translateY(16px) scale(.975)}to{opacity:1;transform:none}}
  #gc-popup-overlay{animation:gc-fade .3s ease both}
  #gc-popup-overlay > div{animation:gc-pop .42s cubic-bezier(.2,.8,.2,1) both}
  #gc-popup-close,#gc-popup-no-thanks{transition:color .22s ease}
  #gc-popup-close:hover,#gc-popup-close:focus-visible,
  #gc-popup-no-thanks:hover,#gc-popup-no-thanks:focus-visible{color:#F3E8D3}

  /* Email fields. Their only feedback was the focus ring the browser draws
     around them; the field itself never acknowledged the cursor. */
  input[type="email"]{transition:border-color .22s ease,background-color .22s ease}
  input[type="email"]:hover{border-color:rgba(243,232,211,0.34)!important}
  input[type="email"]:focus{border-color:rgba(242,169,60,0.55)!important;background:rgba(243,232,211,0.09)!important}
  /* Both email fields carry outline:none inline, which also deleted the focus
     ring for anyone moving through the form on a keyboard. Put it back. */
  input[type="email"]:focus-visible{outline:2px solid #F2A93C!important;outline-offset:2px}

  /* The ticker runs on a loop; stop it while someone is reading it. */
  /* !important: the track sets animation as an inline shorthand, which carries
     an inline animation-play-state:running with it. */
  [data-gc-marquee]:hover [data-gc-marquee-track],
  [data-gc-marquee]:focus-within [data-gc-marquee-track]{animation-play-state:paused!important}

  /* Hovering is a deliberate act, so it stays. Everything that moves on its
     own, or moves the page under someone, comes off. */
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    /* The ticker looped forever with nothing to stop it. */
    [data-gc-marquee-track]{animation:none!important}
    #gc-popup-overlay,#gc-popup-overlay > div{animation:none}
    input[type="email"]{transition:none}
    .gc-pill,.gc-pill-coral,.gc-pill-ghost,.gc-ico,.gc-iconbtn,.gc-pill-dark,.gc-pill-cream,
    .gc-card,.gc-lift,.gc-zoom,a,header nav > div > a::after{transition:none}
    .gc-lift:hover,.gc-lift:focus-within,.gc-zoom:hover,.gc-zoom:focus-within{transform:none}
    .gc-pill:active,.gc-pill-coral:active,.gc-pill-ghost:active,
    .gc-ico:active,.gc-iconbtn:active{transform:none}
    header nav > div > a::after{transform:scaleX(0)}
    header nav > div > a:hover::after,header nav > div > a:focus-visible::after{transform:scaleX(1)}
  }
</style>
