<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  html{overflow-x:clip;scroll-behavior:smooth}
  body{overflow-x:clip;background:#100A05}
  ::selection{background:#F2A93C;color:#100A05}
  a{color:#F2A93C}
  a:hover{color:#FFBA55}
  @keyframes gc-marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  @keyframes gc-kb{from{transform:scale(1.03)}to{transform:scale(1.13)}}
  @keyframes gc-cuedot{0%{transform:translateY(0);opacity:0.2}50%{transform:translateY(8px);opacity:1}100%{transform:translateY(0);opacity:0.2}}
  /* Skip link — visible only when focused. */
  .gc-skip{position:absolute;left:-9999px;top:0;z-index:200;background:#F2A93C;color:#2B1B12;font-family:'Hanken Grotesk',sans-serif;font-weight:700;font-size:14px;padding:12px 18px;border-radius:0 0 10px 0;text-decoration:none}
  .gc-skip:focus{left:0}
  :focus-visible{outline:2px solid #F2A93C;outline-offset:3px}
  /* Animated logo in the header. Until the script registers the element the
     static logo inside it is what shows, and it keeps showing if the script
     never arrives; once :defined matches, the component's own layers take over. */
  gods-chai-logo:defined > picture{display:none!important}  /* beats the include's inline display:block */
  /* The component tints all eleven strokes with one colour, but the lockup is
     two-tone: "God's" and the brush stroke under it in brand orange, "CHAI" and
     the tagline in the cream set by the tint attribute. tools/optimize-logo-sting.py
     stamps data-layer on each stroke so these can be picked out by name.
     Overriding an inline background-color needs !important. */
  gods-chai-logo [data-layer="G"],
  gods-chai-logo [data-layer="od"],
  gods-chai-logo [data-layer="apos"],
  gods-chai-logo [data-layer="s"],
  gods-chai-logo [data-layer="swash"]{background-color:#F2A93C!important}
  /* The fixed nav is 100px tall with the 76px lockup, so anchored sections need
     to clear more than the 84px they carry inline. */
  section[id]{scroll-margin-top:108px!important}

  /* Phones: the nav's four links + @godschai pill overflow past the viewport edge
     (and get silently clipped by overflow-x:clip), so tighten it up down there. */
  @media (max-width:560px){
    header nav{gap:8px!important;padding-left:13px!important;padding-right:13px!important}
    header nav gods-chai-logo,header nav img{height:56px!important;width:56px!important}
    header nav > div{gap:10px!important;font-size:13px!important}
    header nav > a:last-child{font-size:12px!important;padding:10px 11px!important}
    section[id]{scroll-margin-top:88px!important}
  }
  @media (max-width:400px){
    header nav{gap:5px!important;padding-left:10px!important;padding-right:10px!important}
    header nav gods-chai-logo,header nav img{height:46px!important;width:46px!important}
    header nav > div{gap:6px!important;font-size:11.5px!important}
    header nav > a:last-child{font-size:11px!important;padding:9px 9px!important}
    section[id]{scroll-margin-top:78px!important}
  }
  @media (max-width:355px){
    header nav{flex-wrap:wrap!important;justify-content:center!important;row-gap:6px!important}
    /* the wrapped nav is taller again, so the anchor offset has to clear that */
    section[id]{scroll-margin-top:124px!important}
  }
  /* Newsletter tab. Replaces the modal that used to open by itself: this sits
     at the edge of the screen, covers almost nothing, and only opens the signup
     if it is actually tapped. Slides in from off-screen so it is noticed. */
  /* Right edge, below the middle: this page's copy is left-aligned and the hero
     buttons stop well short of the right side, so the tab sits in space nothing
     else uses. On the left it would clip the first characters of body text. */
  #gc-nudge{position:fixed;right:0;top:62%;z-index:9998;transform:translate(110%,-50%);
    transition:transform .55s cubic-bezier(.2,.7,.2,1)}
  #gc-nudge.is-in{transform:translate(0,-50%)}
  #gc-nudge-open{display:block;background:#F2A93C;color:#2B1B12;border:0;
    border-radius:16px 0 0 16px;padding:20px 12px;cursor:pointer;
    font-family:'DM Mono',monospace;font-size:12px;letter-spacing:0.1em;line-height:1;
    box-shadow:0 10px 30px rgba(0,0,0,0.45);transition:background .25s ease}
  #gc-nudge-open:hover{background:#FFBA55}
  /* Bottom-to-top, like a shop-front tab. */
  #gc-nudge-open span{writing-mode:vertical-rl;transform:rotate(180deg);display:block}
  #gc-nudge-close{position:absolute;top:-13px;left:-13px;width:30px;height:30px;
    display:flex;align-items:center;justify-content:center;padding:0;
    background:#2B1B12;color:#F3E8D3;border:1px solid rgba(242,169,60,0.45);
    border-radius:999px;font-size:15px;line-height:1;cursor:pointer;
    font-family:'Hanken Grotesk',sans-serif}
  #gc-nudge-close:hover{background:#3D2A1B}
  @media (prefers-reduced-motion:reduce){#gc-nudge{transition:none}}

  /* Tap targets: the nav and footer links are only 14-18px tall on their own.
     Vertical padding grows the hit area without moving anything visually. */
  header nav > div > a{padding:13px 0!important;white-space:nowrap}
  footer .gc-footer-links a{padding:6px 0!important;margin:-3px 0!important;display:inline-block}
  /* The hot-chai card's panels carry min-width:260/300px, which is wider than a
     320px screen's content box — it forced the card to overflow. */
  @media (max-width:430px){
    #hot > div > div{min-width:0!important}
  }
  /* Community grid: with three tiles, auto-fit left empty cells (a whole dead
     column at desktop widths). Fixed column counts make the tiles tile exactly. */
  @media (min-width:700px){
    #community div[style*="grid-auto-rows"]{grid-template-columns:repeat(4,1fr)!important}
    #community div[style*="grid-auto-rows"] > div:nth-child(2),
    #community div[style*="grid-auto-rows"] > div:nth-child(3){grid-column:span 1!important;grid-row:span 2!important}
  }
  /* Long-form article copy (brew guide, catering). Matches the site voice/palette. */
  .gc-prose{color:#D6C7B4;font-size:1.05rem;line-height:1.65}
  .gc-prose p{margin:0 0 18px}
  .gc-prose h2{font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(1.6rem,3.4vw,2.3rem);letter-spacing:0;color:#F3E8D3;margin:38px 0 12px}
  .gc-prose h3{font-family:'Instrument Serif',serif;font-weight:400;font-size:1.28rem;color:#F3E8D3;margin:26px 0 8px}
  .gc-prose ul,.gc-prose ol{margin:0 0 18px;padding-left:22px}
  .gc-prose li{margin:0 0 9px}
  .gc-prose strong{color:#F3E8D3;font-weight:600}
</style>
