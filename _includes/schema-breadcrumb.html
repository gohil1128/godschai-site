{%- comment -%}
  BreadcrumbList for subpages. A page opts in with front matter:
    breadcrumb: "God's Chai Menu"
{%- endcomment -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": "{{ '/' | absolute_url }}"
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": {{ page.breadcrumb | jsonify }},
      "item": "{{ page.url | absolute_url }}"
    }
  ]
}
</script>
